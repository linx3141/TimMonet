plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.timmonet'
    compileSdk 37

    defaultConfig {
        applicationId 'io.github.linx3141.timmonet'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildFeatures {
        compose true
    }

    signingConfigs {
        // 真签名:凭据从 ~/.gradle/gradle.properties 读取(TM_KEYSTORE 等),
        // 未配置时回退 debug 签名,便于无 key 环境构建。
        release {
            if (project.hasProperty('TM_KEYSTORE')) {
                storeFile file(project.property('TM_KEYSTORE'))
                storePassword project.property('TM_KEYSTORE_PASS')
                keyAlias project.property('TM_KEY_ALIAS')
                keyPassword project.property('TM_KEY_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig project.hasProperty('TM_KEYSTORE')
                    ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'

    // Compose（版本与 KernelSU Manager 一致，全部使用本地缓存）
    implementation 'androidx.compose.ui:ui:1.11.4'
    implementation 'androidx.compose.foundation:foundation:1.11.4'
    implementation 'androidx.compose.runtime:runtime:1.11.4'
    implementation 'androidx.compose.animation:animation:1.11.4'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha18'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'io.github.libxposed:service:102.0.0'
    implementation 'com.materialkolor:material-kolor:5.0.0'
}
